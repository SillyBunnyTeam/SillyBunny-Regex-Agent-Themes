name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    name: Pure tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:pure

  host-contract:
    name: SillyBunny host contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The `runner` context does not exist at job level, so the path is exported here from
      # $RUNNER_TEMP instead. Keeping the clone out of the workspace stops it from showing up
      # as untracked in the stock-baseline diff below.
      - name: Locate the SillyBunny checkout
        run: echo "RAT_ST_ROOT=$RUNNER_TEMP/SillyBunny" >> "$GITHUB_ENV"
      - name: Check out SillyBunny
        run: git clone --depth 1 --branch staging https://github.com/SillyBunnyTeam/SillyBunny.git "$RAT_ST_ROOT"
      - run: npm run test:host
      - name: Verify generated stock baseline
        run: npm run generate:stock -- "$RAT_ST_ROOT" && git diff --exit-code -- src/stock.js
